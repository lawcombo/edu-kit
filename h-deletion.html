<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ㅎ탈락 치료교구</title>
    <link rel="stylesheet" href="h-deletion.css">
</head>
<body>
    <main>
        <section class="screen active" id="infoScreen">
            <div class="container intro-container">
                <button class="back-btn" id="btnBackHome" type="button" aria-label="뒤로가기">&larr;</button>

                <header class="lesson-header">
                    <span class="lesson-badge">음운변동</span>
                    <h1>ㅎ탈락이란?</h1>
                    <p>받침 ㅎ이 모음 앞에서 자연스럽게 사라지는 소리를 익혀요.</p>
                </header>

                <div class="intro-layout">
                    <div class="intro-copy">
                        <p class="eyebrow">ㅎ 받침 + 모음</p>
                        <h2>말할 때 ㅎ이 사라져요</h2>
                    </div>

                    <div class="intro-demo" aria-label="ㅎ탈락 예시">
                        <div class="demo-row">
                            <span class="demo-word">좋</span>
                            <span class="demo-plus">+</span>
                            <span class="demo-word">아</span>
                        </div>
                        <div class="demo-arrow">↓</div>
                        <div class="demo-result">조아</div>
                    </div>
                </div>

                <div class="info-steps">
                    <div class="step-card">
                        <span>1</span>
                        <strong>받침 보기</strong>
                        <p>ㅎ 받침이 들어 있는 말을 봅니다.</p>
                    </div>
                    <div class="step-card">
                        <span>2</span>
                        <strong>소리 바꾸기</strong>
                        <p>실행을 누르면 ㅎ이 빠진 소리를 봅니다.</p>
                    </div>
                    <div class="step-card">
                        <span>3</span>
                        <strong>따라 말하기</strong>
                        <p>보이는 소리를 천천히 따라 말합니다.</p>
                    </div>
                </div>

                <button class="primary-btn wide" id="btnStartPractice" type="button">연습 시작</button>
            </div>
        </section>

        <section class="screen" id="practiceScreen">
            <div class="container practice-container">
                <button class="back-btn" id="btnBackInfo" type="button" aria-label="뒤로가기">&larr;</button>

                <header class="lesson-header compact">
                    <span class="lesson-badge">ㅎ탈락</span>
                    <h1>ㅎ탈락 연습하기</h1>
                    <p>왼쪽 예제를 고르고 실행을 눌러 바뀐 소리를 확인해요.</p>
                </header>

                <div class="practice-top-actions">
                    <button class="btn list-toggle" id="btnToggleHDeletionList" type="button" aria-expanded="false">
                        <span class="hamburger-icon">☰</span><span class="toggle-label">연습목록</span>
                    </button>
                </div>

                <div class="practice-layout" id="hDeletionPracticeLayout">
                    <aside class="word-list" aria-label="연습 목록">
                        <h3>연습 목록</h3>
                        <div id="exampleList"></div>
                    </aside>

                    <section class="practice-panel">
                        <div class="focus-card">
                            <div class="focus-label" id="exampleType">좋 + 아</div>
                            <div class="focus-word" id="writtenWord">좋아</div>
                        </div>

                        <div class="sound-stage">
                            <div class="syllable-box">
                                <div class="box-label">앞말</div>
                                <div class="syllable-main" id="leftSyllable">좋</div>
                                <div class="base-syllable" id="leftBase">조</div>
                            </div>

                            <div class="stage-arrow">+</div>

                            <div class="syllable-box">
                                <div class="box-label">뒤 모음</div>
                                <div class="syllable-main" id="rightSyllable">아</div>
                            </div>
                        </div>

                        <div class="control-row practice-action-row">
                            <button class="btn action-main icon-play" id="btnPlay" type="button" aria-label="실행" title="실행"><span aria-hidden="true" class="icon-label">&#9654;</span></button>
                            <button class="btn secondary icon-next" id="btnNext" type="button" aria-label="다음" title="다음"><span aria-hidden="true" class="icon-label">&#8594;</span></button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="h-deletion.js?v=20260601-fix"></script>
</body>
</html>
