                <header class="lesson-header"><h1>비슷한 말이란?</h1></header>
                <div class="intro-layout">
                    <div class="intro-copy"><p class="eyebrow">뜻이 가까운 말</p><h2>뜻이 비슷해서 바꾸어 말할 수 있는 낱말을 찾아요</h2></div>

        <section class="screen" id="practiceScreen">
