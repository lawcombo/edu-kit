<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-title" content="읽기톡톡">
    <title>범주 찾기</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="assets/css/vocabulary.css?v=20260812-vocabulary-button-fix">
</head>
<body class="vocabulary-practice-page">
    <main>
        <section class="screen active" id="infoScreen">
            <div class="container intro-container">
                <button class="back-btn" id="btnBackHome" type="button" aria-label="뒤로가기">&larr;</button>
                <header class="lesson-header"><h1>범주 찾기란?</h1></header>
                <div class="intro-layout">
                    <div class="intro-copy">
                        <p class="eyebrow">낱말 무리 알기</p>
                        <h2>낱말이 어느 무리에 속하는지 그림과 함께 골라요</h2>
                    </div>
                    <div class="intro-demo">
                        <div class="demo-row">
                            <span class="demo-word">사과</span>
                            <span class="demo-arrow">&rarr;</span>
                            <span class="demo-result">과일</span>
                        </div>
                    </div>
                    <div class="info-steps">
                        <div class="step-card"><span>1</span><strong>낱말 보기</strong><p>그림과 낱말을 함께 봅니다.</p></div>
                        <div class="step-card"><span>2</span><strong>무리 생각</strong><p>어떤 것들과 함께 묶이는지 생각합니다.</p></div>
                        <div class="step-card"><span>3</span><strong>범주 고르기</strong><p>알맞은 범주를 선택합니다.</p></div>
                    </div>
                </div>
                <button class="primary-btn wide" id="btnStartPractice" type="button">연습 시작</button>
            </div>
        </section>
        <section class="screen" id="practiceScreen">
            <div class="container practice-container">
                <div class="top-nav">
                    <button class="btn back-icon-btn" id="btnBackInfo" type="button" aria-label="뒤로가기"><span aria-hidden="true">&larr;</span></button>
                    <h2>범주 찾기 연습하기</h2>
                    <button class="btn list-toggle" id="btnToggleList" type="button" aria-expanded="false"><span class="hamburger-icon">☰</span><span class="toggle-label">연습목록</span></button>
                </div>
                <div class="practice-layout" id="practiceLayout">
                    <aside class="word-list"><h3>연습 목록</h3><div id="exampleList"></div></aside>
                    <section class="practice-panel">
                        <div class="practice-word-card"><div class="practice-title" id="writtenWord">사과</div></div>
                        <div class="visual-area">
                            <div class="picture-card"><div class="picture-emoji" id="pictureEmoji">🍎</div><div class="picture-label" id="pictureLabel">그림을 보고 범주를 생각해요</div></div>
                            <div class="choice-area">
                                <p class="question-text" id="questionText">어느 무리에 속할까요?</p>
                                <div class="choice-grid" id="choiceGrid"></div>
                                <div class="feedback" id="feedbackText">실행을 누르거나 알맞은 보기를 골라요</div>
                            </div>
                        </div>
                        <div class="practice-action-row">
                            <button class="btn secondary icon-prev" id="btnPrev" type="button" aria-label="이전"><span class="icon-label">&#8592;</span></button>
                            <button class="btn action-main icon-play" id="btnPlay" type="button" aria-label="실행"><span class="icon-label">&#9654;</span></button>
                            <button class="btn secondary icon-next" id="btnNext" type="button" aria-label="다음"><span class="icon-label">&#8594;</span></button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <script src="assets/js/navigation.js?v=20260812-device-back"></script>
    <script src="assets/js/tts.js?v=20260616-tts-all"></script>
    <script src="assets/js/vocabulary-category.js?v=20260812-vocabulary"></script>
    <script src="assets/js/pwa.js?v=20260812-update-modal"></script>
</body>
</html>
