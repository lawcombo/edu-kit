<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="읽기톡톡">
    <title>자모읽기</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="assets/css/decoding.css?v=20260811-mobile-fit">
</head>
<body class="decoding-practice-page">
    <main>
        <section class="screen active" id="infoScreen">
            <div class="container intro-container">
                <button class="back-btn" id="btnBackHome" type="button" aria-label="뒤로가기">&larr;</button>
                <header class="lesson-header"><h1>자모읽기란?</h1></header>
                <div class="intro-layout">
                    <div class="intro-copy">
                        <p class="eyebrow">글자와 소리 연결</p>
                        <h2>자음과 모음을 보고 알맞은 소리로 읽어요</h2>
                    </div>
                    <div class="intro-demo" aria-label="자모읽기 예시">
                        <div class="demo-row">
                            <span class="demo-word">ㄱ</span>
                            <span class="demo-arrow">&rarr;</span>
                            <span class="demo-result">그</span>
                        </div>
                    </div>
                </div>
                <div class="info-steps">
                    <div class="step-card"><span>1</span><strong>글자 보기</strong><p>자음과 모음 모양을 천천히 봅니다.</p></div>
                    <div class="step-card"><span>2</span><strong>소리 연결</strong><p>글자에 맞는 기본 소리를 확인합니다.</p></div>
                    <div class="step-card"><span>3</span><strong>따라 읽기</strong><p>들리는 소리를 또렷하게 따라 말합니다.</p></div>
                </div>
                <button class="primary-btn wide" id="btnStartPractice" type="button">연습 시작</button>
            </div>
        </section>
        <section class="screen" id="practiceScreen">
            <div class="container practice-container">
                <div class="top-nav">
                    <button class="btn back-icon-btn" id="btnBackInfo" type="button" aria-label="뒤로가기"><span aria-hidden="true">&larr;</span></button>
                    <h2>자모읽기 연습하기</h2>
                    <button class="btn list-toggle" id="btnToggleList" type="button" aria-expanded="false"><span class="hamburger-icon">☰</span><span class="toggle-label">연습목록</span></button>
                </div>
                <div class="practice-layout" id="practiceLayout">
                    <aside class="word-list" aria-label="연습 목록"><h3>연습 목록</h3><div id="exampleList"></div></aside>
                    <section class="practice-panel">
                        <div class="practice-word-card"><div class="practice-title" id="writtenWord">ㄱ</div></div>
                        <div class="visual-area">
                            <div class="syllable-wrap"><div class="syllable-label">글자</div><div class="syllable-card"><div class="syllable-text" id="leftText">ㄱ</div></div></div>
                            <div class="arrow">&rarr;</div>
                            <div class="syllable-wrap"><div class="syllable-label">이름</div><div class="syllable-card"><div class="syllable-text small" id="middleText">기역</div></div></div>
                            <div class="arrow">&rarr;</div>
                            <div class="syllable-wrap"><div class="syllable-label">소리</div><div class="syllable-card"><div class="syllable-text" id="resultText">그</div></div></div>
                        </div>
                        <div class="practice-action-row">
                            <button class="btn secondary icon-prev" id="btnPrev" type="button" aria-label="이전" title="이전"><span aria-hidden="true" class="icon-label">&#8592;</span></button>
                            <button class="btn action-main icon-play" id="btnPlay" type="button" aria-label="실행" title="실행"><span aria-hidden="true" class="icon-label">&#9654;</span></button>
                            <button class="btn secondary icon-next" id="btnNext" type="button" aria-label="다음" title="다음"><span aria-hidden="true" class="icon-label">&#8594;</span></button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>
    <script src="assets/js/tts.js?v=20260616-tts-all"></script>
    <script src="assets/js/decoding-jamo.js?v=20260811-decoding"></script>
    <script src="assets/js/pwa.js?v=20260811-mobile-polish"></script>
</body>
</html>
