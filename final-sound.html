<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끝소리 규칙 치료교구</title>
    <link rel="stylesheet" href="final-sound.css">
</head>
<body>
    <main>
        <section class="screen active" id="infoScreen">
            <div class="container intro-container">
                <button class="back-btn" id="btnBackHome" type="button" aria-label="뒤로가기">&larr;</button>

                <header class="lesson-header">
                    <span class="lesson-badge">음운변동</span>
                    <h1>끝소리 규칙이란?</h1>
                    <p>낱말 끝 받침은 ㄱ, ㄴ, ㄷ, ㄹ, ㅁ, ㅂ, ㅇ 일곱 소리로 정리됩니다.</p>
                </header>

                <div class="intro-layout">
                    <div class="intro-copy">
                        <p class="eyebrow">받침 글자 → 받침 소리</p>
                        <h2>낱말 끝 받침은<br>정해진 소리로 나요</h2>
                    </div>

                    <div class="intro-demo" aria-label="끝소리 규칙 예시">
                        <div class="demo-row">
                            <span class="demo-word">밖</span>
                            <span class="demo-plus">→</span>
                            <span class="demo-word">박</span>
                        </div>
                        <div class="demo-arrow">↓</div>
                        <div class="demo-result">ㄱ 소리</div>
                    </div>
                </div>

                <div class="info-steps">
                    <div class="step-card">
                        <span>1</span>
                        <strong>받침 고르기</strong>
                        <p>연습할 끝소리 받침을 먼저 고릅니다.</p>
                    </div>
                    <div class="step-card">
                        <span>2</span>
                        <strong>글자 보기</strong>
                        <p>낱말 끝에 적힌 받침 글자를 봅니다.</p>
                    </div>
                    <div class="step-card">
                        <span>3</span>
                        <strong>소리 확인하기</strong>
                        <p>실행을 눌러 실제 소리를 확인합니다.</p>
                    </div>
                </div>

                <button class="primary-btn wide" id="btnStartPractice" type="button">연습 시작</button>
            </div>
        </section>

        <section class="screen" id="selectScreen">
            <div class="container practice-container">
                <div class="top-nav">
                    <button class="btn back-icon-btn" id="btnBackInfo" type="button" aria-label="뒤로가기"><span aria-hidden="true">&larr;</span></button>
                    <h2>받침 선택하기</h2>
                    <span aria-hidden="true"></span>
                </div>

                <div class="final-choice-grid" id="finalGroupList"></div>
            </div>
        </section>

        <section class="screen" id="practiceScreen">
            <div class="container practice-container">
                <div class="top-nav">
                    <button class="btn back-icon-btn" id="btnBackSelect" type="button" aria-label="뒤로가기"><span aria-hidden="true">&larr;</span></button>
                    <h2 id="practiceHeading">ㄱ 받침 연습하기</h2>
                    <button class="btn list-toggle" id="btnToggleFinalSoundList" type="button" aria-expanded="false">
                        <span class="hamburger-icon">☰</span><span class="toggle-label">연습목록</span>
                    </button>
                </div>

                <div class="practice-layout" id="finalSoundPracticeLayout">
                    <aside class="word-list" aria-label="연습 목록">
                        <h3 id="wordListTitle">ㄱ 받침 연습 목록</h3>
                        <div id="exampleList"></div>
                    </aside>

                    <section class="practice-panel">
                        <div class="practice-word-card">
                            <div class="practice-title" id="writtenWord">밖</div>
                        </div>

                        <div class="visual-area">
                            <div class="syllable-wrap">
                                <div class="syllable-label">글자</div>
                                <div class="syllable-card">
                                    <div class="syllable-text" id="writtenSound">밖</div>
                                </div>
                            </div>

                            <div class="arrow">→</div>

                            <div class="syllable-wrap">
                                <div class="syllable-label">소리</div>
                                <div class="syllable-card">
                                    <div class="syllable-text" id="soundBefore">?</div>
                                    <div class="changed-syllable" id="soundAfter">박</div>
                                </div>
                            </div>
                        </div>

                        <div class="control-row practice-action-row">
                            <button class="btn action-main icon-play" id="btnPlay" type="button" aria-label="실행" title="실행"><span aria-hidden="true" class="icon-label">&#9654;</span></button>
                            <button class="btn secondary icon-next" id="btnNext" type="button" aria-label="다음" title="다음"><span aria-hidden="true" class="icon-label">&#8594;</span></button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="final-sound.js?v=20260602"></script>
</body>
</html>
