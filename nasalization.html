<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="읽기톡톡">
    <title>비음화 치료교구</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="assets/css/nasalization.css?v=20260612-demo-box-balance">
</head>
<body>
    <main>
        <section class="screen active" id="infoScreen">
            <div class="container intro-container">
                <button class="back-btn" id="btnBackHome" type="button" aria-label="뒤로가기">&larr;</button>

                <header class="lesson-header">
                    <h1>비음화란?</h1>
                </header>

                <div class="intro-layout">
                    <div class="intro-copy">
                        <p class="eyebrow">받침 + ㄴ/ㅁ</p>
                        <h2>받침 소리가<br>콧소리로 바뀌어요</h2>
                    </div>

                    <div class="intro-demo" aria-label="비음화 예시">
                        <div class="demo-row">
                            <span class="demo-word">국</span>
                            <span class="demo-plus">+</span>
                            <span class="demo-word">물</span>
                        </div>
                        <div class="demo-arrow">↓</div>
                        <div class="demo-result">궁물</div>
                    </div>
                </div>

                <div class="info-steps">
                    <div class="step-card">
                        <span>1</span>
                        <strong>받침 보기</strong>
                        <p>앞말 끝의 받침 소리를 봅니다.</p>
                    </div>
                    <div class="step-card">
                        <span>2</span>
                        <strong>콧소리 바꾸기</strong>
                        <p>실행을 누르면 받침이 콧소리로 바뀝니다.</p>
                    </div>
                    <div class="step-card">
                        <span>3</span>
                        <strong>따라 말하기</strong>
                        <p>바뀐 소리를 천천히 따라 말합니다.</p>
                    </div>
                </div>

                <button class="primary-btn wide" id="btnStartPractice" type="button">연습 시작</button>
            </div>
        </section>

        <section class="screen" id="practiceScreen">
            <div class="container practice-container">
                <div class="top-nav">
                    <button class="btn back-icon-btn" id="btnBackInfo" type="button" aria-label="뒤로가기"><span aria-hidden="true">&larr;</span></button>
                    <h2>비음화 연습하기</h2>
                    <button class="btn list-toggle" id="btnToggleNasalizationList" type="button" aria-expanded="false">
                        <span class="hamburger-icon">☰</span><span class="toggle-label">연습목록</span>
                    </button>
                </div>

                <div class="practice-layout" id="nasalizationPracticeLayout">
                    <aside class="word-list" aria-label="연습 목록">
                        <h3>연습 목록</h3>
                        <div id="exampleList"></div>
                    </aside>

                    <section class="practice-panel">
                        <div class="practice-word-card">
                            <div class="practice-title" id="writtenWord">국물</div>
                        </div>

                        <div class="visual-area">
                            <div class="syllable-wrap">
                                <div class="syllable-label">앞말</div>
                                <div class="syllable-card">
                                    <div class="syllable-text" id="leftSyllable">국</div>
                                    <div class="changed-syllable" id="leftChanged">궁</div>
                                </div>
                            </div>

                            <div class="arrow">→</div>

                            <div class="syllable-wrap">
                                <div class="syllable-label">뒤 소리</div>
                                <div class="syllable-card">
                                    <div class="syllable-text" id="rightSyllable">물</div>
                                </div>
                            </div>
                        </div>

                        <div class="control-row practice-action-row">
                            <button class="btn action-main icon-play" id="btnPlay" type="button" aria-label="실행" title="실행"><span aria-hidden="true" class="icon-label">&#9654;</span></button>
                            <button class="btn secondary icon-next" id="btnNext" type="button" aria-label="다음" title="다음"><span aria-hidden="true" class="icon-label">&#8594;</span></button>
                        </div>
                    </section>
                </div>
            </div>
        </section>
    </main>

    <script src="assets/js/nasalization.js?v=20260602-assets"></script>
    <script src="assets/js/pwa.js?v=20260603-pwa"></script>
</body>
</html>
